<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MonMeuble Pro</title></head><body><p style="font-family:system-ui;padding:24px">Chargement de MonMeuble Pro…</p><script>
(async()=>{try{const files=['assets/part01.txt', 'assets/part02.txt', 'assets/part03.txt', 'assets/part04.txt', 'assets/part05.txt', 'assets/part06.txt', 'assets/part07.txt', 'assets/part08.txt', 'assets/part09.txt', 'assets/part10.txt', 'assets/part11.txt'];const b64=(await Promise.all(files.map(f=>fetch(f).then(r=>{if(!r.ok)throw new Error(f);return r.text()})))).join('');const bin=atob(b64);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<p style="font-family:system-ui;padding:24px">Impossible de charger l’application. Actualisez la page ou utilisez un navigateur récent.</p>';console.error(e)}})();
</script></body></html>
